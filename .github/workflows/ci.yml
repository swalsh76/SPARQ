name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        run: pipx install uv==0.13.4

      - name: Sync
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy packages

      # No database here, so the tests of code that talks to PostgreSQL are skipped and their code
      # looks uncovered. The overall 90% gate is enforced in the database job, where the whole
      # suite runs; this job keeps the 95% gate on the money and fee code, which needs no database.
      - name: Test and coverage (the overall gate is in the database job)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=0

      - name: Coverage gate for money and fee code
        run: >
          uv run coverage report --fail-under=95
          --include="*/sparq_core/fixedpoint.py,*/sparq_core/fees.py"

  database:
    name: database tests (PostgreSQL 18 + TimescaleDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        run: pipx install uv==0.13.4

      - name: Sync
        run: uv sync --locked

      - name: The pinned database versions (from sparq_server.admin.versions)
        run: |
          PINNED=$(uv run python -c "from sparq_server.admin.versions import PINS; print(' '.join(f'{k}={v}*' for k, v in PINS.items()))")
          echo "PINNED_PACKAGES=$PINNED" >> "$GITHUB_ENV"
          echo "pinned: $PINNED"

      - name: Install PostgreSQL 18 and TimescaleDB from their official repositories
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          curl -fsSL https://packagecloud.io/timescale/timescaledb/gpgkey \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/timescaledb.gpg
          echo "deb https://packagecloud.io/timescale/timescaledb/ubuntu/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/timescaledb.list
          sudo apt-get update
          sudo apt-get install -y $PINNED_PACKAGES

      - name: Start a test cluster with TimescaleDB loaded
        run: |
          sudo pg_createcluster 18 main -- --data-checksums
          sudo pg_conftool 18 main set shared_preload_libraries timescaledb
          sudo pg_ctlcluster 18 main start
          pg_lsclusters
          PORT=$(pg_lsclusters -h | awk '$1=="18" && $2=="main" {print $3}')
          sudo -u postgres psql -p "$PORT" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE sparq_test LOGIN SUPERUSER PASSWORD 'sparq_test'" \
            -c "CREATE DATABASE sparq_test OWNER sparq_test"
          echo "SPARQ_TEST_DATABASE_URL=postgresql+asyncpg://sparq_test:sparq_test@localhost:${PORT}/sparq_test" >> "$GITHUB_ENV"

      - name: The whole suite with the database, and the overall coverage gate
        run: uv run pytest --cov --cov-report=term -v

      - name: Versions used
        if: always()
        run: |
          PORT=$(pg_lsclusters -h | awk '$1=="18" && $2=="main" {print $3}')
          sudo -u postgres psql -p "$PORT" -d sparq_test -Atc "SELECT version()" || true
          sudo -u postgres psql -p "$PORT" -d sparq_test -Atc "SELECT extname || ' ' || extversion FROM pg_extension WHERE extname = 'timescaledb'" || true
