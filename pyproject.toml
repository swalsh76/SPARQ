[project]
name = "sparq-workspace"
version = "0.0.0"
description = "SPARQ workspace root (not published)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "sparq-core",
    "sparq-server",
    "sparq-analytics",
    "sparq-durability",
    "hypothesis>=6.140",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sparq-core = { workspace = true }
sparq-server = { workspace = true }
sparq-analytics = { workspace = true }
sparq-durability = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks
"packages/*/tests/**" = ["S101", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = [
    "packages/sparq-core/src",
    "packages/sparq-server/src",
    "packages/sparq-analytics/src",
    "packages/sparq-durability/src",
]
explicit_package_bases = true
# each package has a thin tests/conftest.py of fixtures; two modules cannot share the name
exclude = ['(^|/)conftest\.py$']

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
addopts = "--import-mode=importlib"
markers = [
    "integration: hits the real Kalshi API (opt-in via KALSHI_INTEGRATION=1)",
    "db: needs a PostgreSQL + TimescaleDB server (opt-in via SPARQ_TEST_DATABASE_URL)",
]

[tool.coverage.run]
branch = true
source = ["sparq_core", "sparq_server", "sparq_analytics", "sparq_durability"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
